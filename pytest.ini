[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
addopts = --html=reports/report.html --self-contained-html
markers =
    admin: admin-side browser tests
    customer: customer-side browser tests
    ai: AI recommendation tests
    e2e: end-to-end workflow tests
    unit: fast tests without a browser
    negative: negative (must-fail-safely) scenarios
    tc(id): links a test to its Test Case id in tests/catalog.py
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
